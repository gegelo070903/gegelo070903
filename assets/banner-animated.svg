<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#141a22"/>
      <stop offset="100%" stop-color="#1a1207"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#ffb347;#f97316" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffb347">
        <animate attributeName="stop-color" values="#ffb347;#f97316;#ffb347" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="880" height="220" fill="url(#bg)"/>
  <circle cx="790" cy="30" r="90" fill="none" stroke="#f97316" stroke-opacity="0.22" stroke-width="1.5">
    <animate attributeName="r" values="90;98;90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.22;0.4;0.22" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="30" r="58" fill="none" stroke="#f97316" stroke-opacity="0.35" stroke-width="1.5">
    <animate attributeName="r" values="58;64;58" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="200" r="45" fill="none" stroke="#f97316" stroke-opacity="0.18" stroke-width="1.5">
    <animate attributeName="r" values="45;52;45" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="40" r="3" fill="#f97316" fill-opacity="0.7">
    <animate attributeName="fill-opacity" values="0.7;0.15;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="180" r="2.5" fill="#ffb347" fill-opacity="0.6">
    <animate attributeName="fill-opacity" values="0.6;0.1;0.6" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="150" r="2" fill="#ffffff" fill-opacity="0.4">
    <animate attributeName="fill-opacity" values="0.4;0.05;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="98" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="1">JOHN ANGELO <tspan fill="url(#accent)">VASQUEZ</tspan></text>
  <rect x="340" y="118" width="200" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="200;240;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="340;320;340" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="152" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9" letter-spacing="4">WEB DEVELOPER · DESIGNER · AUTOMATION</text>
  <text x="440" y="182" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">BACOLOD CITY, PHILIPPINES</text>
</svg>
